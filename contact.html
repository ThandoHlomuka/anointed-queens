<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Anointed Queens</title>
<meta name="description" content="Contact the Anointed Queens atelier for custom orders, large commissions and partnerships.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="navSite"></div>
<section class="section">
  <div class="wrap" style="max-width:820px">
    <span class="eyebrow">Contact</span>
    <h1>Speak with the atelier</h1>
    <p class="muted" style="margin-bottom:20px">Questions, large commissions, bridal parties, corporate gifts - we would love to talk.</p>
    <form id="contactForm">
      <div class="grid-products" style="padding-bottom:14px">
        <div class="field"><label>Name</label><input class="input" id="cName"></div>
        <div class="field"><label>Email</label><input class="input" id="cEmail" type="email"></div>
        <div class="field"><label>Subject</label><input class="input" id="cSubject" placeholder="Custom order, bridal party, corporate..."></div>
        <div class="field"><label>Message</label><textarea class="textarea" id="cMessage"></textarea></div>
      </div>
      <button class="btn btn-primary" id="cSend"><i class="fas fa-paper-plane"></i> Send message</button>
    </form>
  </div>
</section>
<div id="footerSite"></div>
<div id="toastWrap"></div>
<script src="config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js?v=1"></script>
<script src="db.js?v=1"></script>
<script src="cart.js?v=1"></script>
<script src="script.js?v=1"></script>
<script src="account.js?v=1"></script>
<script>window.BODY_ACTIVE = 'Contact'; if (window.AQDB && window.AQDB.init) window.AQDB.init();</script>
<script src="pwa.js?v=1"></script>
</body>
</html>
