<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Club - Anointed Queens</title>
<meta name="description" content="Create your account and start earning Anointed Club points.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css?v=4">
<!-- AQ:SEO -->
  <link rel="canonical" href="https://anointed-queens.vercel.app/register.html">
  <meta name="description" content="Join the Anointed Queens family - order bespoke bags, earn rewards and manage your wishes.">
  <meta name="theme-color" content="#0A0A0A">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anointed Queens">
  <meta property="og:title" content="Create an Account | Anointed Queens">
  <meta property="og:description" content="Join the Anointed Queens family - order bespoke bags, earn rewards and manage your wishes.">
  <meta property="og:url" content="https://anointed-queens.vercel.app/register.html">
  <meta property="og:image" content="https://anointed-queens.vercel.app/assets/icons/icon-512-maskable.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Create an Account | Anointed Queens">
  <meta name="twitter:description" content="Join the Anointed Queens family - order bespoke bags, earn rewards and manage your wishes.">
  <meta name="twitter:image" content="https://anointed-queens.vercel.app/assets/icons/icon-512-maskable.png">
  <!-- /AQ:SEO -->
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><span class="mark"><img src="assets/logo.png?v=4" alt="Anointed Queens"></span><span>Anointed Queens</span></a>
    <h1>Join the Club</h1>
    <div class="field"><label>Full name</label><input class="input" id="rName"></div>
    <div class="field"><label>Email</label><input class="input" id="rEmail" type="email"></div>
    <div class="field"><label>Password</label><input class="input" id="rPass" type="password" minlength="6"></div>
    <div id="authErr" style="display:none;color:var(--danger);font-size:.85rem;margin-bottom:10px"></div>
    <button class="btn btn-primary btn-block" id="registerBtn"><i class="fas fa-crown"></i> Create account</button>
    <p style="text-align:center;margin-top:14px;font-size:.9rem" class="muted">Already a queen? <a href="login.html" class="gold">Sign in</a></p>
  </div>
</div>
<div id="toastWrap"></div>
<script src="config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js?v=4"></script>
<script src="db.js?v=4"></script>
<script src="script.js?v=4"></script>
<script>
document.getElementById('registerBtn').addEventListener('click', async function () {
  var btn = this;
  var name = document.getElementById('rName').value.trim();
  var email = document.getElementById('rEmail').value.trim();
  var pass = document.getElementById('rPass').value;
  if (!name || !email || pass.length < 6) { document.getElementById('authErr').textContent = 'Name, valid email and a 6+ char password required.'; document.getElementById('authErr').style.display = 'block'; return; }
  btn.classList.add('loading'); btn.disabled = true;
  var r = await window.AQAuth.signUp(name, email, pass);
  btn.classList.remove('loading'); btn.disabled = false;
  if (r.error) { document.getElementById('authErr').textContent = r.error; document.getElementById('authErr').style.display = 'block'; return; }
  var r2 = await window.AQAuth.signIn(email, pass);
  if (r2.error) { location.href = 'login.html'; return; }
  window.toast('Welcome to the Club, ' + name.split(' ')[0] + '!', 'green');
  location.href = 'account.html';
});
</script>
<script src="pwa.js?v=4"></script>
<!-- AQ:SHARE -->
  <div data-share aria-hidden="true"></div>
  <script src="shares.js?v=4"></script>
  <!-- /AQ:SHARE -->
</body>
</html>
