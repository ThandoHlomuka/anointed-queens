<script>window.BODY_ACTIVE = 'Journal'; if (window.AQDB && window.AQDB.init) window.AQDB.init();
AQDB.getJournal().then(function (posts) {
  document.getElementById('journalGrid').innerHTML = posts.map(function (p) {
    return '<article class="card card-hover" style="padding:22px"><div class="eyebrow">' + new Date(p.published).toLocaleDateString() + '</div>' +
      '<h3>' + window.esc(p.title) + '</h3><p class="muted" style="font-size:.92rem">' + window.esc(p.excerpt) + '</p>' +
      '<button class="btn btn-outline btn-sm" data-j="' + p.id + '">Read <i class="fas fa-arrow-right"></i></button></article>';
  }).join('');
  document.querySelectorAll('[data-j]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = posts.find(function (x) { return x.id === b.getAttribute('data-j'); });
      window.openModal('<span class="eyebrow">' + new Date(p.published).toLocaleDateString() + '</span><h3>' + window.esc(p.title) + '</h3>' +
        '<p style="font-family:var(--font-display);font-size:1.02rem">' + window.esc(p.excerpt) + '</p>' +
        '<p class="muted">' + window.esc(p.body) + '</p>' +
        '<div class="row" style="margin-top:14px"><span class="badge gold"><i class="fas fa-crown"></i> ' + window.esc(p.author) + '</span></div>');
    });
  });
});
</script>
