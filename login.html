<head>

<link rel="stylesheet" href="style.css?v=2">
<!-- AQ:SEO -->
  <link rel="canonical" href="https://anointed-queens.vercel.app/login.html">
  <meta name="description" content="Sign in to your Anointed Queens account to track orders, designs and rewards.">
  <meta name="theme-color" content="#0A0A0A">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anointed Queens">
  <meta property="og:title" content="Sign In | Anointed Queens">
  <meta property="og:description" content="Sign in to your Anointed Queens account to track orders, designs and rewards.">
  <meta property="og:url" content="https://anointed-queens.vercel.app/login.html">
  <meta property="og:image" content="https://anointed-queens.vercel.app/assets/icon-512-maskable.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In | Anointed Queens">
  <meta name="twitter:description" content="Sign in to your Anointed Queens account to track orders, designs and rewards.">
  <meta name="twitter:image" content="https://anointed-queens.vercel.app/assets/icon-512-maskable.png">
  <!-- /AQ:SEO -->
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><span class="mark"><i class="fas fa-crown"></i></span><span>Anointed Queens</span></a>
    <h1>Welcome back</h1>
    <div class="field"><label>Email</label><input class="input" id="aEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>Password</label><input class="input" id="aPass" type="password" autocomplete="current-password"></div>
    <div id="authErr" style="display:none;color:var(--danger);font-size:.85rem;margin-bottom:10px"></div>
    <button class="btn btn-primary btn-block" id="loginBtn"><i class="fas fa-crown"></i> Sign in</button>
    <p style="text-align:center;margin-top:14px;font-size:.9rem" class="muted">New here? <a href="register.html" class="gold">Join the club</a></p>
    <p style="text-align:center;font-size:.78rem;color:var(--text-muted)" id="demoHint"></p>
  </div>
</div>
<div id="toastWrap"></div>
<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js?v=2"></script>
<script src="script.js?v=2"></script>
<script>
if (window.AQ.DEMO) {
  document.getElementById('demoHint').innerHTML = 'Demo mode: any email + password creates/logs into an account. Sign up first to register.';
} else {
  document.getElementById('demoHint').innerHTML = 'Secure Supabase sign in.';
}
document.getElementById('loginBtn').addEventListener('click', async function () {
  var btn = this;
  var email = document.getElementById('aEmail').value.trim();
  var pass = document.getElementById('aPass').value;
  if (!email || !pass) { document.getElementById('authErr').textContent = 'Enter your email and password.'; document.getElementById('authErr').style.display = 'block'; return; }
  btn.classList.add('loading'); btn.disabled = true;
  var r = await window.AQAuth.signIn(email, pass);
  btn.classList.remove('loading'); btn.disabled = false;
  if (r.error) { document.getElementById('authErr').textContent = r.error; document.getElementById('authErr').style.display = 'block'; return; }
  var u = window.AQAuth.currentUser();
  window.toast('Welcome, ' + u.name.split(' ')[0] + '!', 'green');
  location.href = u.role === 'admin' ? 'admin.html' : (new URLSearchParams(location.search).get('next') || 'account.html');
});
</script>
<script src="pwa.js?v=2"></script>
<!-- AQ:SHARE -->
  <div data-share aria-hidden="true"></div>
  <script src="shares.js?v=2"></script>
  <!-- /AQ:SHARE -->
</body>
</html>
