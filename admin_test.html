<script>
/* Test variant: auto-login as demo admin so the harness can exercise the portal. */
if (window.AQ.DEMO) {
  try {
    var users = JSON.parse(localStorage.getItem('aq_demo_users')) || [];
    if (!users.some(function (u) { return u.role === 'admin'; })) {
      users.push({ id: 'aq_admin', email: 'admin@anointedqueens.test', name: 'Admin Queen', password: 'admin123', role: 'admin', loyalty_points: 0, referral_code: 'AQADMIN', created_at: new Date().toISOString() });
      localStorage.setItem('aq_demo_users', JSON.stringify(users));
    }
    localStorage.setItem('aq_session', JSON.stringify({ id: 'aq_admin', email: 'admin@anointedqueens.test', name: 'Admin Queen', role: 'admin', demo: true }));
  } catch (e) {}
}
</script>
